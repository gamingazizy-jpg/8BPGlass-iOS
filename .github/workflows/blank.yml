name: Build & Inject Tweak
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build Tweak
        run: |
          cd Tweak
          make clean
          make package
      - name: Extract IPA
        run: |
          unzip -o "*.ipa" -d build/extracted/
      - name: Inject Dylib
        run: |
          cp Tweak/.theos/obj/debug/EightBPGlass.dylib build/extracted/Payload/pool.app/
          cd build/extracted/Payload/pool.app
          insert_dylib --inplace @executable_path/EightBPGlass.dylib pool
      - name: Repack IPA
        run: |
          cd build/extracted
          zip -r ../../8BPGlass_Modded.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: 8BPGlass_Modded.ipa
          path: 8BPGlass_Modded.ipa
